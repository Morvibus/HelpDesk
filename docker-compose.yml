name: HelpDesk
services:

  # ---------------------------------------------
  # BASE DE DATOS: PostgreSQL
  # ---------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: helpdesk_db
    restart: always
    environment:
      POSTGRES_USER: helpdesk_user
      POSTGRES_PASSWORD: helpdesk_password
      POSTGRES_DB: helpdesk_db
    ports:
      - "127.0.0.1:5432:5432" # solo desde el propio equipo: la red entra únicamente por el 5173
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk_user -d helpdesk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------
  # BACKEND: FastAPI (Python)
  # ---------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helpdesk_backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000" # el navegador llega al API por el proxy /api de Vite
    env_file:
      - ./backend/.env # aporta SECRET_KEY (y DATABASE_URL, que 'environment' sobrescribe)
    environment:
      - DATABASE_URL=postgresql://helpdesk_user:helpdesk_password@db:5432/helpdesk_db
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------
  # FRONTEND: React (Vite + TailwindCSS)
  # ---------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: helpdesk_frontend
    restart: always
    ports:
      - "5173:5173" # Puerto por defecto de Vite
    environment:
      - API_PROXY_TARGET=http://backend:8000 # el proxy /api de Vite llega al backend por la red de Docker
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
